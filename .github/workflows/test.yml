# ルールと候補生成のテストを流すだけ。
# 公開は GitHub 側の Pages 設定（Settings → Pages）が受け持つので、
# ここでは何も配信しない。
name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node test/rules.test.js
